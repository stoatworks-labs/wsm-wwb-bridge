name: release

# Freeze the Tkinter app with PyInstaller for Windows, macOS and Linux
# (x64 + arm64). Linux jobs also emit .deb/.rpm via nfpm.
# Trigger manually (Actions > release > Run workflow) or by pushing a v* tag.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,    os: ubuntu-latest,    pkgarch: amd64 }
          - { name: linux-aarch64,   os: ubuntu-24.04-arm, pkgarch: arm64 }
          - { name: windows-x86_64,  os: windows-latest }
          - { name: windows-aarch64, os: windows-11-arm }
          # ONE macOS build for both architectures. This already built both
          # on the same runner (x86_64 via --target-architecture on the arm64
          # image), so universal2 merges them rather than adding a build.
          - { name: macos-universal, os: macos-14, pyi_arch: 'universal2' }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Derive version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (PyInstaller)
        run: pyinstaller --noconfirm --clean --windowed --onefile --name wsm-wwb-bridge ${{ matrix.pyi_arch && format('--target-architecture {0}', matrix.pyi_arch) || '' }} main.py

      - name: Stage output
        shell: bash
        run: |
          mkdir -p out
          if [[ "${{ matrix.os }}" == windows* ]]; then
            cp dist/wsm-wwb-bridge.exe out/
          elif [[ "${{ matrix.os }}" == macos* ]]; then
            # --windowed yields a .app bundle on macOS
            if [ -d "dist/wsm-wwb-bridge.app" ]; then cp -R "dist/wsm-wwb-bridge.app" out/; else cp dist/wsm-wwb-bridge out/; fi
          else
            cp dist/wsm-wwb-bridge out/
          fi
          ls -la out

      - name: Package .deb/.rpm (Linux only)
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        env:
          PKGARCH: ${{ matrix.pkgarch }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1
          export PATH="$(go env GOPATH)/bin:$PATH"
          cat > nfpm.yaml <<EOF
          name: wsm-wwb-bridge
          arch: ${PKGARCH}
          version: "${VERSION}"
          maintainer: Allan Sargeant <allan.sargeant@gmail.com>
          description: Bridge radio-mic coordination data between Shure WWB and Sennheiser WSM
          license: MIT
          contents:
            - src: out/wsm-wwb-bridge
              dst: /usr/bin/wsm-wwb-bridge
          EOF
          nfpm package -f nfpm.yaml -p deb
          nfpm package -f nfpm.yaml -p rpm

      - name: Archive
        shell: bash
        run: |
          cd out
          if [[ "${{ matrix.os }}" == windows* ]]; then
            7z a "../wsm-wwb-bridge-${{ matrix.name }}.zip" ./*
          else
            tar czf "../wsm-wwb-bridge-${{ matrix.name }}.tar.gz" ./*
          fi

      # Prove the bundle really is universal rather than named that way.
      # Captured and matched with `case`, never piped into grep: steps run as
      # `bash -eo pipefail`, so grep exiting at its first match SIGPIPEs lipo
      # and fails the step BECAUSE the match was found.
      - name: Verify the macOS build is universal
        if: runner.os == 'macOS'
        shell: bash
        run: |
          found=0
          while IFS= read -r f; do
            __archs="$( lipo -archs "$f" 2>/dev/null )" || continue
            [ -n "$__archs" ] || continue
            found=$((found+1))
            echo "$f: $__archs"
            case "$__archs" in
              *arm64*) ;;
              *) echo "expected an arm64 slice in $f, got: $__archs" >&2; exit 1 ;;
            esac
            case "$__archs" in
              *x86_64*) ;;
              *) echo "expected an x86_64 slice in $f, got: $__archs" >&2; exit 1 ;;
            esac
          done < <(find "out" -type f -perm -u+x)
          # A find that matched nothing would pass every check above in silence.
          if [ "$found" -lt 1 ]; then
            echo "found no Mach-O to check under "out"" >&2
            exit 1
          fi

      - name: Installers (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # A zipped .app is not an install experience. The .pkg puts it in
        # /Applications, the .dmg lets people drag it. Ad-hoc signed first:
        # PyInstaller's bundle is unsigned, and an unsigned bundle is refused
        # with "is damaged and can't be opened" on Apple Silicon.
        run: |
          source scripts/release-lib.sh
          rl_init "WSM-WWB Bridge" wsm-wwb-bridge \
            "${{ steps.ver.outputs.version }}" com.stoatworks.wsm-wwb-bridge "$GITHUB_WORKSPACE"
          app="out/wsm-wwb-bridge.app"
          if [ -d "$app" ]; then
            rl_adhoc_sign "$app"
            rl_dmg "${{ matrix.name }}" out --app "wsm-wwb-bridge.app"
            rl_pkg "${{ matrix.name }}" out --app "wsm-wwb-bridge.app"
          else
            echo "no .app bundle (PyInstaller produced a bare binary), skipping installers"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wsm-wwb-bridge-${{ matrix.name }}
          path: |
            *.zip
            *.tar.gz
            *.deb
            *.rpm
            *.dmg
            *.pkg
          if-no-files-found: error

  windows-installers:
    name: Windows installers
    needs: build
    runs-on: ubuntu-latest
    # makensis cross-compiles, so both Windows architectures are wrapped here
    # from the zips the build jobs uploaded — the arm64 Windows image cannot
    # execute the 32-bit makensis at all.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build installers
        shell: bash
        run: |
          source scripts/release-lib.sh
          version="${GITHUB_REF_NAME#v}"
          rl_init "WSM-WWB Bridge" wsm-wwb-bridge "$version" \
            com.stoatworks.wsm-wwb-bridge "$PWD/installers"
          for arch in x86_64 aarch64; do
            zip="$(find artifacts -name "wsm-wwb-bridge-windows-${arch}.zip" | head -1)"
            if [ -z "$zip" ]; then
              echo "no build artefact for windows-${arch}, skipping"
              continue
            fi
            stage="$RUNNER_TEMP/stage-${arch}"
            rm -rf "$stage"; mkdir -p "$stage"
            unzip -q "$zip" -d "$stage"
            rl_nsis "windows-${arch}" "$stage" --gui "wsm-wwb-bridge.exe"
          done
          ls -l installers

      - uses: actions/upload-artifact@v7
        with:
          name: wsm-wwb-bridge-windows-installers
          path: installers/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, windows-installers]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
